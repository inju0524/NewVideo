name: Mobile release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --concurrency=1

  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: >-
          flutter build apk --release --no-pub
          --build-name=1.0.5 --build-number=7
          --android-project-arg=kotlin.incremental=false
          --android-project-arg=kotlin.compiler.execution.strategy=in-process

      - name: Prepare release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk xuanlan-1.0.5-android.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: xuanlan-1.0.5-android.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUNDLE_ID: app.zhuying.zhuying
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Select iOS signing mode
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_TEAM_ID" ]]; then
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=unsigned' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Ad Hoc signing
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_PATTERN="${PROFILE_APP_ID#*.}"
          if [[ "$PROFILE_TEAM_ID" != "$IOS_TEAM_ID" ]]; then
            echo 'Provisioning profile Team ID does not match IOS_TEAM_ID.' >&2
            exit 1
          fi
          case "$IOS_BUNDLE_ID" in
            $PROFILE_APP_PATTERN) ;;
            *) echo "Provisioning profile does not match $IOS_BUNDLE_ID" >&2; exit 1 ;;
          esac
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo 'The provisioning profile must be Ad Hoc and include registered devices.' >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Apple Distribution:/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo 'No Apple Distribution identity found in the imported certificate.' >&2
            exit 1
          fi
          echo "IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          export PROFILE_NAME
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "ad-hoc",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "stripSwiftSymbols": True,
              "thinning": "<none>",
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
              plistlib.dump(options, output)
          PY

      - name: Build Ad Hoc iOS package
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub --build-name=1.0.5 --build-number=7
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp build/ios/ipa/*.ipa xuanlan-1.0.5-ios-adhoc.ipa

      - name: Build unsigned iOS package
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub --build-name=1.0.5 --build-number=7
          mkdir -p "$RUNNER_TEMP/ios-ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ios-ipa/Payload/Runner.app"
          (
            cd "$RUNNER_TEMP/ios-ipa"
            /usr/bin/zip -qr "$GITHUB_WORKSPACE/xuanlan-1.0.5-ios-unsigned.ipa" Payload
          )

      - name: Remove signing materials
        if: always() && steps.signing.outputs.mode == 'adhoc'
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: xuanlan-1.0.5-ios-*.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Download mobile packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "玄览 $GITHUB_REF_NAME" \
            --notes "Android APK and iOS IPA built from commit $GITHUB_SHA. The iOS IPA is Ad Hoc installable when signing secrets are configured; otherwise it is unsigned and cannot be installed directly."
